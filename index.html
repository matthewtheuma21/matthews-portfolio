    <!-- STAR ANIMATION -->
    <script>
        const star = document.getElementById("spinStar");

        function spinStar() {
            star.classList.remove("spin");

            // Restart animation
            void star.offsetWidth;

            star.classList.add("spin");
        }

        // Play automatically when the page loads
        window.addEventListener("load", () => {
            setTimeout(spinStar, 500); // waits half a second after loading
        });

        // Play again whenever it's clicked
        star.addEventListener("click", spinStar);
    </script>

    <!-- VIDEO PREVIEWS -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const videos = document.querySelectorAll("video");

            videos.forEach(video => {
                video.muted = true;
                video.setAttribute("muted", "");
                video.setAttribute("playsinline", "");
                video.setAttribute("webkit-playsinline", "");

                const playPromise = video.play();

                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Autoplay prevented:", error);
                    });
                }
            });

        });
    </script>

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const rows = document.querySelectorAll(".kinetic-row");


            function clamp(value, min, max) {
                return Math.min(Math.max(value, min), max);
            }


            /*
             * Smooth easing.
             */
            function smooth(t) {
                return t * t * (3 - 2 * t);
            }


            function animateKinetic() {

                const viewportHeight = window.innerHeight;


                rows.forEach((row, index) => {

                    const shape =
                        row.querySelector(".kinetic-shape");

                    const word =
                        row.querySelector(".kinetic-word");


                    const rect =
                        row.getBoundingClientRect();


                    /*
                     * Animation starts when the row
                     * begins entering the lower part
                     * of the screen.
                     *
                     * It finishes when the row reaches
                     * roughly the middle of the screen.
                     */

                    const startPoint =
                        viewportHeight * 0.95;

                    const endPoint =
                        viewportHeight * 0.38;


                    let progress =
                        (startPoint - rect.top) /
                        (startPoint - endPoint);


                    progress =
                        clamp(progress, 0, 1);


                    progress =
                        smooth(progress);


                    /* =========================================
                       ALTERNATING HORIZONTAL MOVEMENT
                    ========================================= */


                    let x;


                    if (index % 2 === 0) {

                        /*
                         * LEFT → RIGHT
                         */

                        x =
                            -85 +
                            (progress * 85);

                    } else {

                        /*
                         * RIGHT → LEFT
                         */

                        x =
                            85 -
                            (progress * 85);

                    }


                    /* =========================================
                       VERTICAL MOVEMENT
                    ========================================= */

                    const y =
                        5 -
                        (progress * 5);


                    /* =========================================
                       SCALE
                    ========================================= */

                    const scale =
                        0.90 +
                        (progress * 0.10);


                    shape.style.transform = `
                translate(
                    calc(-50% + ${x}vw),
                    ${y}px
                )
                scale(${scale})
            `;


                    /* =========================================
                       TEXT
                    ========================================= */

                    const textProgress =
                        clamp(
                            (progress - 0.35) / 0.30,
                            0,
                            1
                        );


                    word.style.opacity =
                        textProgress;


                    const direction =
                        index % 2 === 0 ? 10 : -10;


                    const textX =
                        direction -
                        (direction * textProgress);


                    const textY =
                        12 -
                        (12 * textProgress);


                    word.style.transform = `
                translate(
                    ${textX}px,
                    ${textY}px
                )
            `;

                });

            }


            window.addEventListener(
                "scroll",
                animateKinetic,
                { passive: true }
            );


            window.addEventListener(
                "resize",
                animateKinetic
            );


            animateKinetic();

        });

    </script>
