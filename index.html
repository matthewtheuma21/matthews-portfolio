<!-- TOP RED SCROLL LINE -->
<script>
    window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const docHeight = document.body.scrollHeight - window.innerHeight;
        const scrollPercent = (scrollTop / docHeight) * 100;

        document.querySelector('.scroll-bar').style.width = scrollPercent + '%';
    });
</script>

    <!-- STAR ANIMATION -->
    <script>
        const star = document.getElementById("spinStar");

        function spinStar() {
            star.classList.remove("spin");

            // Restart animation
            void star.offsetWidth;

            star.classList.add("spin");
        }

        // Play automatically when the page loads
        window.addEventListener("load", () => {
            setTimeout(spinStar, 500); // waits half a second after loading
        });

        // Play again whenever it's clicked
        star.addEventListener("click", spinStar);
    </script>

    <!-- VIDEO PREVIEWS -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const videos = document.querySelectorAll("video");

            videos.forEach(video => {
                video.muted = true;
                video.setAttribute("muted", "");
                video.setAttribute("playsinline", "");
                video.setAttribute("webkit-playsinline", "");

                const playPromise = video.play();

                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Autoplay prevented:", error);
                    });
                }
            });

        });
    </script>
